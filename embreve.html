<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Em Breve | Avengers: Doomsday</title>
     <link rel="shortcut icon" href="img/faviconDooms-32x32.png" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:#050608;

            font-family:Arial,sans-serif;
        }

        .container{
            text-align:center;
        }

        .container span{
            display:block;

            color:#00A86B;

            font-size:14px;
            font-weight:bold;

            letter-spacing:5px;

            margin-bottom:20px;
        }

        .container h1{
            font-family:"Bebas Neue",sans-serif;

            font-size:clamp(100px,15vw,220px);

            color:#00A86B;

            line-height:.9;

            text-shadow:
                0 0 15px rgba(0,168,107,.6),
                0 0 40px rgba(0,168,107,.3);
        }

        .container p{
            margin-top:20px;

            color:#8f98a3;

            font-size:18px;
        }

    </style>

</head>

<body>

    <div class="container">

        <span>VINGADORES: DOOMSDAY</span>

        <h1>EM BREVE</h1>

        <p>
            Esta área será disponibilizada em breve.
        </p>

    </div>

</body>

</html>
